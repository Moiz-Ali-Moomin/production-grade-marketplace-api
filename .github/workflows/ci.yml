name: continuous-integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint

    - name: Prisma Generate
      run: npx prisma generate

    - name: Run Tests
      run: npm test
      env:
        DATABASE_URL: postgres://testuser:testpassword@localhost:5432/marketplace_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: testsecret
        NODE_ENV: test

    - name: Build TypeScript
      run: npm run build

    - name: Upload Coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: coverage/
